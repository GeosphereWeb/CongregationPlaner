name: CI - SonarCloud, Lint & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-coverage:
    name: Code Quality & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck -Dorg.gradle.dependency.verification=off

      - name: Run Detekt
        run: ./gradlew detekt -Dorg.gradle.dependency.verification=off

      - name: Build and Generate Coverage Report
        run: ./gradlew koverXmlReport koverHtmlReport --no-daemon -Dorg.gradle.dependency.verification=off
        continue-on-error: true

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-daemon -Dorg.gradle.dependency.verification=off

      - name: Upload Coverage to SonarCloud
        uses: codecov/codecov-action@v4
        with:
          files: ./composeApp/build/reports/kover/report.xml
          flags: unittests
          fail_ci_if_error: false

