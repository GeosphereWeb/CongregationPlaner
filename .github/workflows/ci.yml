name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore Firebase Configuration Files
        env:
          ANDROID_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          IOS_SECRET: ${{ secrets.IOS_GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$ANDROID_SECRET" | base64 --decode > androidApp/google-services.json
          mkdir -p iosApp/iosApp
          echo "$IOS_SECRET" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Build (assemble)
        run: ./gradlew assemble --no-daemon
