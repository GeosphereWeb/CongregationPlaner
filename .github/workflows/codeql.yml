# ##############################################################################
# CodeQL Analyse-Workflow (VORÜBERGEHEND DEAKTIVIERT)
# ##############################################################################
#
# HINWEIS: Dieser Workflow wurde vorübergehend deaktiviert, da CodeQL aktuell 
# Kotlin 2.4.0 noch nicht unterstützt (Stand Juni 2026). 
# Sobald GitHub CodeQL für Kotlin 2.4.0 freigibt, kann dieser Workflow 
# wieder aktiviert werden.
#
# FEHLERMELDUNG WAR: "Kotlin version 2.4.0 is too recent. CodeQL currently 
# supports versions below 2.3.30"
#
# ##############################################################################

name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ermöglicht manuelles Starten zum Testen

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: false # <<--- DEAKTIVIERT: Hier auf 'true' setzen, wenn Kotlin 2.4.0 unterstützt wird
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean assemble --no-daemon --no-build-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
