# ##############################################################################
# CodeQL Analyse-Workflow
# ##############################################################################
#
# WAS IST CODEQL?
# CodeQL ist die Analyse-Engine von GitHub zur Sicherheitsprüfung. Sie behandelt 
# Code wie Daten. Sicherheitslücken werden als Abfragen (Queries) formuliert, 
# die über die "Datenbank" deines Codes laufen.
#
# WARUM FÜR KOTLIN MULTIPLATFORM (KMP)?
# In einem KMP-Projekt teilst du viel Logik zwischen Android, iOS, Desktop und Web.
# CodeQL hilft dabei, Logikfehler oder Sicherheitsrisiken im gemeinsamen Code 
# (shared module) sowie in den plattformspezifischen Teilen frühzeitig zu finden.
#
# BESONDERHEITEN DIESER DATEI:
# 1. Manuelles Build-Handling: Anstatt "autobuild" zu nutzen, führen wir den 
#    Gradle-Build explizit aus. Das ist bei KMP sicherer, um sicherzustellen, 
#    dass alle relevanten Module indiziert werden.
# 2. JDK Setup: Wir nutzen Java 17 (oder höher), was für moderne KMP-Projekte 
#    Standard ist.
#
# ##############################################################################

name: "CodeQL"

on:
  push:
    branches: [ "main", "master" ] # Analysiert bei jedem Push auf den Haupt-Branch
  pull_request:
    branches: [ "main", "master" ] # Analysiert PRs gegen den Haupt-Branch
  schedule:
    - cron: '30 1 * * 0' # Wöchentlicher Scan am Sonntag um 01:30 Uhr

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Erforderlich, um Ergebnisse in das Security-Tab hochzuladen

    strategy:
      fail-fast: false
      matrix:
        # CodeQL unterstützt Java/Kotlin, JavaScript/TypeScript, Python, etc.
        # Für KMP konzentrieren wir uns primär auf 'java-kotlin'.
        # Wenn dein webApp-Teil viel JS enthält, könnte man 'javascript-typescript' hinzufügen.
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Java Setup: Wichtig für den Gradle-Build von KMP-Projekten.
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Initialisiert das CodeQL-Tooling für die gewählten Sprachen.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Falls du eigene Abfragen hast, könnten diese hier konfiguriert werden.
        # queries: ./path/to/local/queries, security-extended, security-and-quality

    # ##########################################################################
    # BUILD-SCHRITT (MANUELL FÜR KMP)
    # ##########################################################################
    # Warum manuell? 
    # CodeQL muss "sehen", wie der Code kompiliert wird, um ihn zu verstehen.
    # Bei KMP kann die Automatik manchmal verwirrt sein, welche Targets (Android, JVM etc.) 
    # gebaut werden sollen. Wir kompilieren hier das Projekt einmal durch.
    # ##########################################################################
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # WICHTIG: Wir nutzen 'clean', um sicherzustellen, dass Gradle nicht 
      # auf alte Ergebnisse (UP-TO-DATE) zurückgreift. CodeQL muss die 
      # Kompilierung "sehen". Mit '--no-build-cache' verhindern wir zudem, 
      # dass vorkompilierte Binaries aus dem Cache geladen werden.
      run: ./gradlew clean assemble --no-daemon --no-build-cache

    # Führt die eigentliche Analyse durch.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

# ERWEITERTES WISSEN:
# - Die Ergebnisse findest du unter dem Tab "Security" -> "Code scanning" in deinem GitHub Repo.
# - CodeQL erkennt Probleme wie: 
#   - Hardcoded Credentials (Passwörter im Code)
#   - SQL Injection Risiken
#   - Unsichere kryptographische Algorithmen
#   - NullPointer-Potentiale in Kotlin (soweit über die Typ-Sicherheit hinaus relevant)
# - Für KMP gilt: Da der 'shared' Code oft für JVM gebaut wird, deckt 'java-kotlin' 
#   einen Großteil der Logik ab, auch wenn sie später auf iOS oder JS läuft.
