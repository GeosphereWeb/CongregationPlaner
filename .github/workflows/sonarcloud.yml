name: SonarCloud Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is missing; continuing without it"
          else
            mkdir -p androidApp
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          fi

      - name: Create GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICES_BASE64: ${{ secrets.IOS_GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -z "$IOS_GOOGLE_SERVICES_BASE64" ]; then
            echo "IOS_GOOGLE_SERVICES_BASE64 secret is missing; continuing without it"
          else
            mkdir -p iosApp
            echo "$IOS_GOOGLE_SERVICES_BASE64" | base64 --decode > iosApp/GoogleService-Info.plist
          fi

      - name: Run tests, coverage and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Required secret SONAR_TOKEN is missing"
            exit 1
          fi

          # Schritt 1: Nur die Tests ausführen
          ./gradlew :shared:jvmTest :shared:testAndroidHostTest --no-daemon --info

          # Schritt 2: Kover-Reports generieren (Hier wird es vermutlich hängen bleiben)
          ./gradlew koverXmlReport mergeKoverXml --no-daemon --info

          # Schritt 3: Sonar ausführen
          ./gradlew sonar --no-daemon --info

      - name: Remove generated Firebase files
        if: always()
        run: |
          rm -f androidApp/google-services.json
          rm -f iosApp/GoogleService-Info.plist

      - name: Done
        run: echo "SonarCloud analysis finished"

# Notes:
# - Create the following repository secrets in GitHub: SONAR_TOKEN (from SonarCloud),
#   SONAR_ORGANIZATION (your SonarCloud organization key), SONAR_PROJECT_KEY (project key in SonarCloud).
# - The root Gradle script includes the SonarQube Gradle plugin; CI runs the `sonar` Gradle task.
