name: SonarCloud Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run tests, coverage and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Required secret SONAR_TOKEN is missing";
            exit 1;
          fi
          # Definitionen aus build.gradle.kts; SONAR_TOKEN aus der Umgebungsvariable.
          # Tests vor koverXmlReport (Kover misst nur JVM/Android-Tests).
          # assemble wird von den Test-/Android-Tasks mitgezogen – kein separater Build-Schritt nötig.
          ./gradlew :shared:jvmTest :shared:testAndroidHostTest koverXmlReport mergeKoverXml sonar --no-daemon --info

      - name: Done
        run: echo "SonarCloud analysis finished"

# Notes:
# - Create the following repository secrets in GitHub: SONAR_TOKEN (from SonarCloud),
#   SONAR_ORGANIZATION (your SonarCloud organization key), SONAR_PROJECT_KEY (project key in SonarCloud).
# - The root Gradle script includes the SonarQube Gradle plugin; CI runs the `sonar` Gradle task.
