name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether to run web steps
        id: web-check
        shell: bash
        run: |
          if [ -f webApp/package-lock.json ]; then
            lock=true
          else
            lock=false
          fi

          run_web=false
          if [ "$lock" = "true" ]; then
            run_web=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "No package-lock.json found; checking PR for webApp changes..."
            BASE_REF=${{ github.event.pull_request.base.ref }}
            git fetch origin $BASE_REF --depth=1 || true
            if git diff --name-only origin/$BASE_REF...HEAD | grep -q '^webApp/'; then
              run_web=true
            fi
          fi

          echo "lockfile=$lock" >> $GITHUB_OUTPUT
          echo "run_web=$run_web" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore Node cache
        if: steps.web-check.outputs.run_web == 'true' && steps.web-check.outputs.lockfile == 'true'
        uses: actions/cache@v4
        with:
          path: |
            webApp/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-web-${{ hashFiles('webApp/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-web-

      - name: Install NPM dependencies
        if: steps.web-check.outputs.run_web == 'true' && steps.web-check.outputs.lockfile == 'true'
        working-directory: webApp
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        if: steps.web-check.outputs.run_web == 'true' && steps.web-check.outputs.lockfile == 'true'
        working-directory: webApp
        run: npx playwright@1.49.1 install --with-deps --ignore-scripts || true

      - name: Run Playwright E2E tests
        if: steps.web-check.outputs.run_web == 'true' && steps.web-check.outputs.lockfile == 'true'
        working-directory: webApp
        run: npx playwright@1.49.1 test --reporter=list --ignore-scripts
