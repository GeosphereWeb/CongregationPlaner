# Detekt Configuration for CongregationPlaner
build:
  maxIssues: 0
  maxIssuesPercentage: null
  weights:
    DLT: 1
    psm: 1
    rFa: 1

config:
  validation: true
  warningsAsErrors: false
  checkBuildUponDefaultConfig: false
  detectors: ''
  excludeDefaultRuleSets: false
  includeDefaultRuleSets: true
  autoCorrect: false
  baseline: null

output:
  activeByDefault: true
  buildUponDefaultConfig: true
  exclude:
    - '**/test/**'
    - '**/androidTest/**'
    - '**/.gradle/**'
    - '**/build/**'

rules:
  active: true
  excludeDefaultRuleSets: false
  
  # Code Smells
  complexity:
    active: true
    CognitiveComplexMethod:
      active: true
      threshold: 15
    CyclomaticComplexMethod:
      active: true
      threshold: 15
    LongMethod:
      active: true
      threshold: 60
    LongParameterList:
      active: true
      functionThreshold: 5
      constructorThreshold: 7
    NestedBlockDepth:
      active: true
      threshold: 4
    TooManyFunctions:
      active: true
      thresholdInClasses: 11
      thresholdInInterfaces: 11
      thresholdInObjects: 11
      thresholdInEnums: 11
  
  # Empty Code Blocks
  empty:
    active: true
    EmptyCatchBlock:
      active: true
      allowedExceptionNameRegex: '_|(ignore|expected)'
    EmptyClassBody:
      active: false
    EmptyDefaultConstructor:
      active: false
    EmptyDoWhileBlock:
      active: true
    EmptyElseBlock:
      active: true
    EmptyFinallyBlock:
      active: true
    EmptyForBlock:
      active: true
    EmptyFunctionExpression:
      active: false
    EmptyIfBlock:
      active: true
    EmptyInitBlock:
      active: true
    EmptyKtFile:
      active: true
    EmptySecondaryConstructor:
      active: true
    EmptyWhenBlock:
      active: true
  
  # Error Prone Issues
  errorprone:
    active: true
    CastToNullableType:
      active: false
    DeferredHeritageCall:
      active: true
    Deprecation:
      active: false
    DuplicateCaseInWhenExpression:
      active: true
    EqualsAlwaysReturnsTrueOrFalse:
      active: true
    EqualsWithHashCodeExternalOnly:
      active: false
    ExceptionRaisedInUnexpectedLocation:
      active: true
      methodNames: [ 'toString', 'hashCode', 'equals', 'finalize' ]
    HasPlatformType:
      active: false
    ImplicitUnitReturnType:
      active: false
    MissingPackageDeclaration:
      active: false
    NullCheckZeroToOne:
      active: false
    NullableToStringCall:
      active: false
    RedundantElseInWhen:
      active: true
    ReturnFromFinally:
      active: true
    SwallowedException:
      active: true
    ThrowingExceptionFromFinally:
      active: true
    ThrowingExceptionInMain:
      active: false
    ThrowingNewInstanceOfSameException:
      active: true
    UnreachableCode:
      active: true
    UnsafeCallOnNullableType:
      active: true
    UnsafeCast:
      active: false
    UnusedUnaryOperator:
      active: true
    UselessPostfixExpression:
      active: false
  
  # Exception Rules
  exceptions:
    active: true
    ExceptionRaisedInUnexpectedLocation:
      active: false
    ObjectExtendsThrowable:
      active: false
    PrintStackTrace:
      active: false
    RethrowCaughtException:
      active: true
    ReturnFromFinally:
      active: false
    SwallowedException:
      active: false
    ThrowingExceptionFromFinally:
      active: false
    ThrowingExceptionInMain:
      active: false
    ThrowingNewInstanceOfSameException:
      active: false
    TooGenericExceptionCaught:
      active: true
      exceptionNames:
        - ArrayIndexOutOfBoundsException
        - Error
        - Exception
        - IllegalMonitorStateException
        - NullPointerException
        - RuntimeException
        - Throwable
      allowedExceptionNameRegex: '_|(ignore|expected)'
    TooGenericExceptionThrown:
      active: true
      exceptionNames:
        - Error
        - Exception
        - Throwable
        - RuntimeException
  
  # Naming
  naming:
    active: true
    ClassNaming:
      active: true
      classPattern: '[A-Z]([a-zA-Z0-9]*)?'
    ConstructorParameterNaming:
      active: true
      parameterPattern: '[a-z][a-zA-Z0-9]*'
      privateParameterPattern: '[a-z][a-zA-Z0-9]*'
    EnumNaming:
      active: true
      enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
    FunctionMaxLength:
      active: false
      maximumFunctionNameLength: 30
    FunctionMinLength:
      active: false
      minimumFunctionNameLength: 3
    FunctionNaming:
      active: true
      functionPattern: '([a-z][a-zA-Z0-9]*)?'
      excludeClassPattern: '$^'
      ignoreOverridden: true
    FunctionParameterNaming:
      active: true
      parameterPattern: '[a-z][a-zA-Z0-9]*'
      excludeClassPattern: '$^'
      ignoreOverriddenFunction: true
    InvalidPackageDeclaration:
      active: false
      rootPackage: ''
    MatchingDeclarationName:
      active: true
      mustBeFirst: true
    MemberNameEqualsClassName:
      active: true
      ignoreOverridden: true
    ObjectPropertyNaming:
      active: true
      constantPattern: '[A-Za-z][_A-Za-z0-9]*'
      propertyPattern: '[a-z][A-Za-z0-9]*'
      privatePropertyPattern: '(_)?[a-z][A-Za-z0-9]*'
    PackageNaming:
      active: true
      packagePattern: '^[a-z]+(\.[a-z][a-z0-9]*)*$'
    TopLevelPropertyNaming:
      active: true
      constantPattern: '[A-Z][_A-Z0-9]*'
      propertyPattern: '[a-z][a-zA-Z0-9]*'
      privatePropertyPattern: '_?[a-z][a-zA-Z0-9]*'
    VariableNaming:
      active: true
      variablePattern: '[a-z][a-zA-Z0-9]*'
      privateVariablePattern: '(_)?[a-z][a-zA-Z0-9]*'
  
  # Performance
  performance:
    active: true
    ArrayPrimitive:
      active: true
    ForEachOnRange:
      active: true
      excludedTypes: []
    SpreadOperator:
      active: true
    UnnecessaryPartOfBinaryExpression:
      active: false
    UnnecessaryTemporaryInstantiation:
      active: true
  
  # Potential Bugs
  potential-bugs:
    active: true
    Deprecation:
      active: false
    DuplicateCaseInWhenExpression:
      active: false
    EqualsAlwaysReturnsTrueOrFalse:
      active: false
    EqualsWithHashCodeExternalOnly:
      active: false
    ExplicitGarbageCollectionCall:
      active: true
    HasPlatformType:
      active: false
    ImplicitDefaultLocale:
      active: false
    ImplicitUnitReturnType:
      active: false
    InvalidRange:
      active: false
    IteratorNotThrowingNoSuchElementException:
      active: false
    MapGetWithNotNullAssertionOperator:
      active: false
    MissingPackageDeclaration:
      active: false
    MissingDependsOnDslMarker:
      active: false
    NullCheckZeroToOne:
      active: false
    NullableToStringCall:
      active: true
    RedundantElseInWhen:
      active: false
    UnreachableCode:
      active: false
    UnusedUnaryOperator:
      active: false
    UnsafeCallOnNullableType:
      active: false
    UnsafeCast:
      active: false
    UselessPostfixExpression:
      active: false
    WrongEqualsTypeParameter:
      active: false
  
  # Style
  style:
    active: true
    BracesOnIfStatements:
      active: true
      singleLineStatementUseRun: false
    BracesOnWhenStatements:
      active: false
    CanBeNonNullable:
      active: false
    CascadingCallWrapping:
      active: false
    ClassOrdering:
      active: false
    CollapsibleIfStatements:
      active: false
    DataClassContainsFunctions:
      active: false
    DataClassShouldBeImmutable:
      active: false
    DestructuringDeclarationWithTooManyEntries:
      active: false
      maxDestructuringEntries: 3
    EqualsNullCall:
      active: false
    EqualsOnNullableType:
      active: true
    EqualsToCallEquals:
      active: true
    ExplicitCollectionElementAccessMethod:
      active: false
    ExplicitItLambdaParameter:
      active: false
    ExpressionBodySyntax:
      active: false
    ForbiddenComment:
      active: true
      values: [ 'TODO:', 'FIXME:', 'STOPSHIP:' ]
      allowedPatterns: ''
    ForbiddenImport:
      active: false
      imports: [ 'java.util.Date' ]
    ForbiddenVoidType:
      active: false
    FunctionOnlyReturningConstant:
      active: true
      ignoreOverridableFunction: true
      excludeAnnotatedFunction: [ 'dagger.Provides', 'javax.inject.Provides' ]
      ignoreActualFunction: true
    LibraryCodeMustSpecifyReturnType:
      active: true
    LibraryEntitiesShouldNotExposeInternalTypes:
      active: true
    LoopWithTooManyJumpStatements:
      active: true
      maxJumpCount: 4
    MagicNumber:
      active: true
      excludes: [ '**/test/**', '**/androidTest/**', '**/*.kts' ]
      ignoreNumbers: [ '-1', '0', '1', '2', '100', '1000' ]
      ignoreHashCodeFunction: true
      ignorePropertyDeclaration: false
      ignoreLocalVariableDeclaration: false
      ignoreConstantDeclaration: true
      ignoreCompanionObjectPropertyDeclaration: true
      ignoreAnnotation: false
      ignoreNamedArgument: true
      ignoreEnumEntry: true
    MandatoryBracesLoops:
      active: true
    MaxLineLength:
      active: true
      maxLineLength: 120
      excludePackageStatements: true
      excludeImportStatements: true
      excludeCommentStatements: false
    MayBeConst:
      active: true
    ModifierOrder:
      active: true
    MultilineLambdaItParameter:
      active: false
    MultilineRawStringLiteral:
      active: false
    NestedClassesVisibility:
      active: false
    NestedSafeQueriesCanBeFlattened:
      active: false
    NewLineAtEndOfFile:
      active: true
    NoTabs:
      active: false
    NullableBooleanCheck:
      active: false
    ObjectLiteralToLambda:
      active: false
    OptionalAbstractKeyword:
      active: true
    OptionalUnit:
      active: false
    OptionalWhenBraces:
      active: false
    PreferToOverPairSyntax:
      active: false
    ProtectedMemberInFinalClass:
      active: true
    RedundantExplicitType:
      active: false
    RedundantHigherOrderMapUsage:
      active: false
    RedundantInnerClassModifier:
      active: true
    RedundantSemicolon:
      active: true
    RedundantVisibilityModifier:
      active: true
    RedundantVisibilityModifierForExtensionDeclaration:
      active: false
    ReturnCount:
      active: true
      max: 2
      excludedFunctions: [ 'equals' ]
      excludeLabeled: false
      excludeReturnFromLambda: true
      excludeGuardClauses: false
    SafeCast:
      active: true
    SerialVersionUIDInSerializableClass:
      active: false
    SinceKotlin:
      active: false
    SpacingBetweenPackageAndImports:
      active: true
    StringLiteralDuplication:
      active: true
      excludeAnnotatedProperties: false
      excludeStringsWithLessThan5Characters: true
    SwallowedException:
      active: false
    ThrowsCount:
      active: true
      max: 2
    TrailingCommaOnArgumentList:
      active: false
    TrailingCommaOnCallSite:
      active: false
    TrailingCommaOnCollectionLiteral:
      active: false
    TrailingCommaOnParameterList:
      active: false
    TrailingWhitespace:
      active: true
    TrimMultilineRawString:
      active: false
    UnnecessaryAbstractClass:
      active: false
    UnnecessaryAnnotationUseSiteTarget:
      active: false
    UnnecessaryApply:
      active: true
    UnnecessaryBackticks:
      active: false
    UnnecessaryBracesAroundTrailingLambda:
      active: false
    UnnecessaryInheritance:
      active: true
    UnnecessaryInnerClass:
      active: false
    UnnecessaryLet:
      active: true
    UnnecessaryParentheses:
      active: false
    UnnecessaryWildcardImport:
      active: true
    UnusedImports:
      active: true
    UnusedPrivateClass:
      active: true
    UnusedPrivateMember:
      active: true
      allowedNames: '(_|ignored|expected|serialVersionUID)'
    UseArrayLiteralsInAnnotations:
      active: false
    UseCheckNotNull:
      active: false
    UseCheckOrError:
      active: false
    UseEmptyCounterpart:
      active: false
    UseIfEmptyOrIfBlank:
      active: false
    UseIfInsteadOfWhen:
      active: false
    UseOrEmpty:
      active: false
    UseRequire:
      active: false
    UseRequireNotNull:
      active: false
    UseSparseArrays:
      active: true
    UseStdlibAssert:
      active: false
    VarCouldBeVal:
      active: true
    WildcardImport:
      active: true
      excludeImports: [ 'java.util.*', 'kotlinx.android.synthetic.*' ]
